name: xzll_im_flutter_client
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.3
  image_picker: ^1.2.0
  # 添加权限处理
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  http: ^1.5.0
  # 本地数据存储
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  rxdart: ^0.28.0
  rxdart_flutter: ^0.0.2
  logger: ^2.6.1
  get: ^4.7.2
  json_annotation: ^4.9.0
  connectivity_plus: ^7.0.0
  flex_color_scheme: ^8.3.0
  sqflite: ^2.4.2
  path: ^1.9.1
  pull_down_button: ^0.10.2
  # 添加表单验证库
  form_validator: ^2.1.1
  dio: ^5.9.0
  talker_dio_logger: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.11.1
  build_runner: ^2.8.0


flutter:
  uses-material-design: true
  # 本地图片
  assets:
    - assets/my_headImage.png
